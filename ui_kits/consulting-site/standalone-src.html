</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.standalone.jsx"></script>
<script type="text/babel" src="HomeScreen.standalone.jsx"></script>
<script type="text/babel" src="SpeakerScreen.jsx"></script>
<script type="text/babel" src="CaseStudiesScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [route, setRoute] = React.useState('home');
  React.useEffect(()=>{ if(window.lucide) lucide.createIcons(); }, [route]);
  const go = r => { setRoute(r); window.scrollTo(0,0); };
  return <SiteShell route={route} onNavigate={go}>
    {route === 'home' && <HomeScreen onNavigate={go} />}
    {route === 'speaker' && <SpeakerScreen onNavigate={go} />}
    {route === 'cases' && <CaseStudiesScreen />}
  </SiteShell>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
