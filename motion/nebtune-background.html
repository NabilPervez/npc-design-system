<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebtune Background</title>
<!--
  NPC / Nebtune motion background — 2026 direction.
  OBS: add as a Browser Source pointing at this file (Local file), 1920×1080.
  Keep it inside the repo so ../assets/ resolves.
  Animates only transform and opacity. Set maxBlurPx: 0 if frames drop while gaming.
-->
<style>
  :root{
    --ink-950:#07101F;
    --gold-hi:#F5D97A; --gold:#DDB84A; --gold-deep:#C88B20;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink-950)}
  body.transparent{background:transparent}
  #stage{position:fixed;inset:0;overflow:hidden}
  /* Faint full-field lattice, the one ornament */
  #field{position:absolute;inset:-88px;background:url("../assets/pattern-gold-tile-2x.png") 0 0/88px 88px repeat;opacity:.05;will-change:transform}
  /* Vignette keeps edges quiet so the stream content reads */
  #vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(7,16,31,.85) 100%);pointer-events:none}
  body.transparent #vignette{display:none}
  .el{position:absolute;left:0;top:0;will-change:transform,opacity;opacity:0}
  .el img{display:block;width:100%;height:100%}
  .patch{background:url("../assets/pattern-gold-tile-2x.png") 0 0/56px 56px repeat;
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
  .glint{position:absolute;inset:0;opacity:0;will-change:opacity;
    background:radial-gradient(circle,rgba(245,217,122,.55),transparent 62%);mix-blend-mode:screen}
</style>
</head>
<body>
<div id="stage"><div id="field"></div><div id="vignette"></div></div>
<script>
/* ---------- Settings ---------- */
const CONFIG = {
  seed: 7,                 // same seed = same layout every load
  count: 16,               // 12–20 elements
  markShare: 0.4,          // share of elements that are N marks (rest are lattice patches)
  speed: 1,                // 1 = brand pace (slow). 0.5 slower, 1.5 faster
  opacity: [0.06, 0.22],   // min/max element opacity (quiet texture, never loud)
  size: [90, 320],         // px
  maxBlurPx: 2,            // depth blur on far elements; 0 for best performance
  shimmerEvery: [14, 26],  // seconds between gold glints
  background: "solid",     // "solid" (ink #07101F) or "transparent"
  markSrc: "../assets/mark-nebtune-gold.png",
};
/* ------------------------------ */

if (CONFIG.background === "transparent") document.body.classList.add("transparent");
const stage = document.getElementById("stage");
const field = document.getElementById("field");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Seeded RNG so layouts are repeatable
let s = CONFIG.seed >>> 0;
const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
const lerp = (a, b, t) => a + (b - a) * t;
// Brand easing cubic-bezier(.16,1,.3,1) used as a smooth in-out for breathing
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

const W = () => innerWidth, H = () => innerHeight;
const els = [];
for (let i = 0; i < CONFIG.count; i++) {
  const depth = rnd();                       // 0 far → 1 near
  const isMark = rnd() < CONFIG.markShare;
  const size = lerp(CONFIG.size[0], CONFIG.size[1], isMark ? depth * .7 : depth);
  const node = document.createElement("div");
  node.className = "el" + (isMark ? "" : " patch");
  node.style.width = node.style.height = size + "px";
  if (isMark) {
    const img = new Image(); img.src = CONFIG.markSrc; img.alt = ""; node.appendChild(img);
    const g = document.createElement("div"); g.className = "glint"; node.appendChild(g);
  }
  const blur = CONFIG.maxBlurPx * (1 - depth);
  if (blur > .2) node.style.filter = `blur(${blur.toFixed(1)}px)`;
  stage.insertBefore(node, document.getElementById("vignette"));
  els.push({
    node, isMark, depth, size,
    x: rnd(), y: rnd(),
    vx: lerp(-1, 1, rnd()) * lerp(4, 14, depth),   // px/s, nearer moves faster (parallax)
    vy: lerp(-1, 1, rnd()) * lerp(3, 10, depth),
    rot: lerp(-8, 8, rnd()), sway: isMark ? 4 : 10,        // gentle sway; the N stays upright
    op: lerp(CONFIG.opacity[0], CONFIG.opacity[1], .35 + depth * .65) * (isMark ? 1.8 : 1),
    breath: lerp(9, 16, rnd()), phase: rnd(),
    fadeIn: lerp(.8, 2.4, rnd()),
    glint: isMark ? node.querySelector(".glint") : null,
  });
}

// Occasional gold glint on one N mark (opacity only)
const marks = els.filter(e => e.isMark);
let nextGlint = lerp(...CONFIG.shimmerEvery, rnd()) * 1000 / CONFIG.speed;
function glint() {
  if (!marks.length) return;
  const g = marks[Math.floor(rnd() * marks.length)].glint;
  g.animate([{opacity:0},{opacity:.9},{opacity:0}],
    {duration: 2600 / CONFIG.speed, easing: "cubic-bezier(.16,1,.3,1)"});
}

let last = performance.now(), t0 = last;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000) * CONFIG.speed; last = now;
  const t = (now - t0) / 1000 * CONFIG.speed;
  for (const e of els) {
    const pad = e.size;
    e.x += e.vx * dt / W(); e.y += e.vy * dt / H();
    // wrap around edges
    if (e.x < -pad / W()) e.x = 1 + pad / W(); if (e.x > 1 + pad / W()) e.x = -pad / W();
    if (e.y < -pad / H()) e.y = 1 + pad / H(); if (e.y > 1 + pad / H()) e.y = -pad / H();
    const b = ease((Math.sin((t / e.breath + e.phase) * Math.PI * 2) + 1) / 2);
    const scale = 1 + b * .04;
    const fade = Math.min(1, t / e.fadeIn);
    e.node.style.transform =
      `translate3d(${(e.x * W() - e.size / 2).toFixed(1)}px,${(e.y * H() - e.size / 2).toFixed(1)}px,0) rotate(${(e.rot + Math.sin((t / e.breath + e.phase) * Math.PI) * e.sway).toFixed(2)}deg) scale(${scale.toFixed(3)})`;
    e.node.style.opacity = (e.op * (.75 + b * .25) * fade).toFixed(3);
  }
  // whole lattice drifts very slowly
  field.style.transform = `translate3d(${(t * 1.2) % 88}px,${(t * .6) % 88}px,0)`;
  if ((now - t0) > nextGlint) { glint(); nextGlint += lerp(...CONFIG.shimmerEvery, rnd()) * 1000 / CONFIG.speed; }
  requestAnimationFrame(frame);
}

if (reduce) {
  // Reduced motion: a still composition
  for (const e of els) {
    e.node.style.transform = `translate3d(${e.x * W() - e.size / 2}px,${e.y * H() - e.size / 2}px,0) rotate(${e.rot}deg)`;
    e.node.style.opacity = e.op;
  }
} else requestAnimationFrame(frame);
</script>
</body>
</html>
