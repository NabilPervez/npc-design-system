<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.wrap{padding:18px 20px;display:flex;flex-direction:column;gap:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="../../guidelines/card-theme.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Button, Eyebrow, SectionHead, Divider, Tag, StatChip } = window.NPCDesignSystem_2f0ecd;
const I = n => <i data-lucide={n} style={{width:13,height:13}}></i>;
function Demo(){
  return <div className="wrap">
    <div className="row"><Button>Book Nabil</Button><Button variant="secondary">Download Kit</Button><Button variant="ghost">Speaking</Button><Button variant="link">Explore Company Branding</Button><Button disabled>Disabled</Button></div>
    <div className="row"><Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg" iconRight={I('arrow-up-right')}>Large</Button></div>
    <Divider spacing="var(--sp-2)" />
    <Eyebrow>Award-Winning Product Manager</Eyebrow>
    <SectionHead>Experience</SectionHead>
    <div className="row"><Tag variant="primary">Adobe Experience Manager</Tag><Tag variant="primary">Gradial</Tag><Tag>Jira</Tag><Tag>Confluence</Tag><Tag shape="pill">Aug 2025 – Present</Tag></div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
      <StatChip value="10+" label="Years XP" /><StatChip value="12+" label="AI Apps" /><StatChip value="$5M+" label="Portfolio Managed" /><StatChip value="90%" label="Client Referral" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
setTimeout(()=>window.lucide&&lucide.createIcons(),60);
</script></body></html>
