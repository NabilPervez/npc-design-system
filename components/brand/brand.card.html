<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../guidelines/card-theme.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.lbl{font-size:.52rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div id="root"></div>
<script type="text/babel">
const DS = window.NPCDesignSystem_2f0ecd;
const { Wordmark } = DS;
const PatternPanel = DS.PatternPanel || (({children,style}) => <div style={{background:'var(--pattern-ground)',...style}}>{children}</div>);
const Cell = ({label, children}) => <div style={{display:'grid',justifyItems:'center',gap:8}}>{children}<span className="lbl">{label}</span></div>;
function Demo(){
  return <div>
    <div style={{display:'grid',gridTemplateColumns:'200px 1fr',minHeight:160}}>
      <PatternPanel size="sm" />
      <div style={{background:'var(--pattern-ground)',display:'grid',placeItems:'center'}}><Wordmark size={50} /></div>
    </div>
    <div style={{padding:'18px 20px',display:'flex',gap:24,alignItems:'flex-end',flexWrap:'wrap'}}>
      <Cell label="type · justified"><Wordmark variant="type" size={28} /></Cell>
      <Cell label="horizontal"><Wordmark variant="horizontal" size={32} /></Cell>
      <Cell label="badge"><Wordmark variant="badge" size={44} /></Cell>
      <Cell label="chip"><Wordmark variant="chip" size={44} /></Cell>
      <Cell label="chip-npc"><Wordmark variant="chip-npc" size={44} /></Cell>
      <Cell label="tile"><Wordmark variant="tile" size={44} /></Cell>
      <Cell label="gold-bright"><Wordmark variant="mark" size={36} tone="gold-bright" /></Cell>
      <Cell label="paper"><Wordmark variant="mark" size={36} tone="paper" /></Cell>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
