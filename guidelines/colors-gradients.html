<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g">
<div style="height:34px;border-radius:6px;background:var(--grad)"></div><div class="lbl">--grad · 120° F0CC6A → C88B20 → E8B840 · primary buttons</div>
<div style="height:34px;border-radius:6px;background:var(--grad-champagne)"></div><div class="lbl">--grad-champagne · print / foil sim</div>
<div style="height:34px;border-radius:6px;background:var(--ink-850);position:relative;overflow:hidden"><span style="position:absolute;inset:0;background:var(--shine);transform:skewX(-12deg)"></span></div><div class="lbl">--shine · the diagonal hover wipe</div>
</div></body></html>
