<!-- @dsCard group="Surfaces" viewport="700x170" name="Card anatomy" subtitle="Hairline gold border, 10px radius, flat at rest" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="r" style="gap:14px"><div style="flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:22px 24px"><div style="font-family:var(--font-serif);font-weight:600;font-size:1.08rem">At rest</div><div style="font-size:.82rem;color:var(--text-muted);margin-top:8px">1px rgba(220,180,80,.20) · no shadow</div></div>
<div style="flex:1;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:10px;padding:22px 24px;transform:translateY(-2px) scale(1.012);box-shadow:var(--shadow-card-hover)"><div style="font-family:var(--font-serif);font-weight:600;font-size:1.08rem">Hovered</div><div style="font-size:.82rem;color:var(--text-muted);margin-top:8px">−2px lift · 1.012 scale · gold border</div></div></div></body></html>
