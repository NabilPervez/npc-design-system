<!-- @dsCard group="Brand" viewport="700x240" name="Geometric pattern" subtitle="Print presentation: champagne hairlines on near-white" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="card-theme.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.row{display:grid;grid-template-columns:repeat(4,1fr);height:170px}.p{position:relative;overflow:hidden;background:var(--pattern-ground)}.p span{position:absolute;inset:0;background-image:var(--pattern-gold);background-repeat:repeat;opacity:var(--pattern-opacity)}.cap{font-size:.53rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted);padding:8px 10px;line-height:1.5}</style></head>
<body><div class="row">
<div class="p"><span style="background-size:var(--pattern-tile-sm) auto"></span></div>
<div class="p"><span style="background-size:var(--pattern-tile) auto"></span></div>
<div class="p"><span style="background-size:var(--pattern-tile) auto;opacity:var(--pattern-opacity-subtle)"></span></div>
<div class="p"><span style="background-size:var(--pattern-tile) auto;-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent)"></span></div>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr)"><div class="cap">sm · 56px<br>cards, print</div><div class="cap">md · 88px<br>default</div><div class="cap">subtle<br>behind text</div><div class="cap">fade<br>split layouts</div></div></body></html>
