<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g"><div class="r"><div class="sw" style="background:var(--ink-950);color:#E2EAF4"><span>ink-950</span><span class="hex">#07101F</span></div><div class="sw" style="background:var(--ink-900);color:#E2EAF4"><span>ink-900</span><span class="hex">#0B1526</span></div><div class="sw" style="background:var(--ink-850);color:#E2EAF4"><span>ink-850</span><span class="hex">#0C1829</span></div><div class="sw" style="background:var(--ink-800);color:#E2EAF4"><span>ink-800</span><span class="hex">#131921</span></div><div class="sw" style="background:var(--ink-700);color:#E2EAF4"><span>ink-700</span><span class="hex">#2C2E35</span></div><div class="sw" style="background:var(--ink-600);color:#E2EAF4"><span>ink-600</span><span class="hex">#3A4459</span></div><div class="sw" style="background:var(--ink-500);color:#07101F"><span>ink-500</span><span class="hex">#5E718F</span></div></div><div class="lbl">ink-800 is the business-card print master · ink-950 is the web ground</div></div></body></html>
