<!-- @dsCard group="Brand" viewport="700x210" name="Pattern on light vs dark" subtitle="Same tile; ground and strength flip with the theme" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="card-theme.js"></script>
<style>body{margin:0;font-family:var(--font-sans)}.row{display:grid;grid-template-columns:1fr 1fr;height:150px}.p{position:relative;overflow:hidden}.p span{position:absolute;inset:0;background-image:var(--pattern-gold);background-repeat:repeat;background-size:88px auto}.tag{position:absolute;left:12px;bottom:10px;z-index:2;font-size:.53rem;letter-spacing:1.6px;text-transform:uppercase}.cap{font-size:.53rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted);padding:8px 12px}</style></head>
<body>
<div class="row">
<div class="p" style="background:#F8FBFF"><span style="opacity:.85"></span><span class="tag" style="color:#8A5C08">light · 0.85 on paper-50</span></div>
<div class="p" style="background:#0D1522"><span style="opacity:.22"></span><span class="tag" style="color:#DDB84A">dark · 0.22 on ink-880</span></div>
</div>
<div class="cap">The print form is the canonical one. On ink the hairlines must drop back hard or they glare — same artwork, same 88px tile, different strength.</div>
</body></html>
