<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g"><div style="font-family:var(--font-serif);font-weight:300;font-size:48px;line-height:1.04;letter-spacing:-1px">Scaling <em style="font-style:italic;color:var(--gold)">Creativity</em></div>
<div style="font-family:var(--font-serif);font-weight:600;font-size:16px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)">Case Studies</div>
<div class="lbl">300 for display · 600 uppercase for section heads · italic is the emphasis device</div></div></body></html>
