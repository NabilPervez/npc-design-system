<!-- @dsCard group="Brand" viewport="700x210" name="Marks on light vs dark" subtitle="Same marks, correct tint for each ground" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="card-theme.js"></script>
<style>body{margin:0;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr}.half{padding:20px 18px;display:grid;gap:16px;align-content:start}.r{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.lbl{font-size:.52rem;letter-spacing:1.6px;text-transform:uppercase}</style></head>
<body>
<div class="half" style="background:var(--paper-50)">
<span class="lbl" style="color:#8A5C08">Light ground · gold-deep</span>
<div class="r"><img src="../assets/mark-nebtune-gold-deep.png" style="width:38px"><img src="../assets/monogram-npc-gold-deep.png" style="height:26px"><img src="../assets/wordmark-nabil-pervez-gold-deep.png" style="height:19px"></div>
<div class="r"><div style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(160,110,10,.4);display:grid;place-items:center;background:var(--paper-50)"><img src="../assets/mark-nebtune-gold-deep.png" style="width:22px"></div><div style="width:44px;height:44px;border-radius:10px;background:var(--gold-500);display:grid;place-items:center"><img src="../assets/mark-nebtune-ink.png" style="width:23px"></div><div style="width:44px;height:44px;border-radius:10px;background:var(--ink-880);display:grid;place-items:center"><img src="../assets/mark-nebtune-gold.png" style="width:23px"></div></div>
</div>
<div class="half" style="background:var(--ink-880)">
<span class="lbl" style="color:#DDB84A">Dark ground · gold-bright / paper</span>
<div class="r"><img src="../assets/mark-nebtune-gold-bright.png" style="width:38px"><img src="../assets/monogram-npc-paper.png" style="height:26px"><img src="../assets/wordmark-nabil-pervez-gold-bright.png" style="height:19px"></div>
<div class="r"><div style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(200,168,76,.4);display:grid;place-items:center"><img src="../assets/mark-nebtune-gold-bright.png" style="width:22px"></div><div style="width:44px;height:44px;border-radius:10px;background:var(--gold-500);display:grid;place-items:center"><img src="../assets/mark-nebtune-ink.png" style="width:23px"></div><div style="width:44px;height:44px;border-radius:10px;background:var(--paper-50);display:grid;place-items:center"><img src="../assets/mark-nebtune-gold-deep.png" style="width:23px"></div></div>
</div>
</body></html>
