<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="r" style="align-items:center;gap:16px"><img src="../assets/mark-nebtune-teal.png" style="width:56px;height:56px"><div><div class="sw" style="background:var(--teal-500);color:#07101F"><span>teal-500</span><span class="hex">#48A3C2</span></div></div><div class="lbl" style="flex:1;min-width:180px">Carried over from the Nebtune era. Use the gold or paper tint of the mark in NPC contexts; never introduce teal into type, borders or fills.</div></div></body></html>
