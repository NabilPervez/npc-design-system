<!-- @dsCard group="Colors" viewport="700x120" name="Paper ramp" subtitle="Light-theme surfaces" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g"><div class="r"><div class="sw" style="background:var(--paper-50);color:#07101F"><span>paper-50</span><span class="hex">#F8FBFF</span></div><div class="sw" style="background:var(--paper-100);color:#07101F"><span>paper-100</span><span class="hex">#EEF2FA</span></div><div class="sw" style="background:var(--paper-200);color:#07101F"><span>paper-200</span><span class="hex">#DEE5F0</span></div><div class="sw" style="background:#0D1829;color:#F8FBFF"><span>text</span><span class="hex">#0D1829</span></div><div class="sw" style="background:#6A7A96;color:#F8FBFF"><span>text-muted</span><span class="hex">#6A7A96</span></div></div><div class="lbl">Light theme is a secondary mode — dark is the default</div></div></body></html>
