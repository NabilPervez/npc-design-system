<!-- @dsCard group="Colors" viewport="700x150" name="Semantic aliases" subtitle="What to reach for, not what colour it is" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g" style="grid-template-columns:1fr 1fr;display:grid;gap:6px 20px;font-size:.68rem">
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--bg</span><span style="width:44px;height:14px;background:var(--bg);border:1px solid var(--border)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--bg-card</span><span style="width:44px;height:14px;background:var(--bg-card);border:1px solid var(--border)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--text</span><span style="width:44px;height:14px;background:var(--text)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--text-muted</span><span style="width:44px;height:14px;background:var(--text-muted)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--gold</span><span style="width:44px;height:14px;background:var(--gold)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--gold-dim</span><span style="width:44px;height:14px;background:var(--gold-dim)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--border</span><span style="width:44px;height:14px;border:1px solid var(--border)"></span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex">--border-strong</span><span style="width:44px;height:14px;border:1px solid var(--border-strong)"></span></div>
</div></body></html>
