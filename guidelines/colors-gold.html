<!-- @dsCard group="Colors" viewport="700x130" name="Gold & champagne" subtitle="The single brand accent, screen and print" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g"><div class="r"><div class="sw" style="background:var(--gold-100);color:#07101F"><span>gold-100</span><span class="hex">#F5D97A</span></div><div class="sw" style="background:var(--gold-200);color:#07101F"><span>gold-200</span><span class="hex">#F0CC6A</span></div><div class="sw" style="background:var(--gold-300);color:#07101F"><span>gold-300</span><span class="hex">#DDB84A</span></div><div class="sw" style="background:var(--gold-400);color:#07101F"><span>gold-400</span><span class="hex">#C8A84C</span></div><div class="sw" style="background:var(--gold-500);color:#07101F"><span>gold-500</span><span class="hex">#AC9760</span></div><div class="sw" style="background:var(--gold-600);color:#07101F"><span>gold-600</span><span class="hex">#C88B20</span></div><div class="sw" style="background:var(--gold-700);color:#F8FBFF"><span>gold-700</span><span class="hex">#9A6A10</span></div><div class="sw" style="background:var(--gold-800);color:#F8FBFF"><span>gold-800</span><span class="hex">#8A5C08</span></div></div><div class="lbl">gold-300 = screen brand gold · gold-500 = champagne print master · gold-700 = light-theme gold</div></div></body></html>
