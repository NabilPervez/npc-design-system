<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div style="position:relative;height:104px;border-radius:8px;overflow:hidden;background:var(--grad)"><div style="position:absolute;inset:0;background-image:var(--noise);background-size:180px;opacity:.55"></div><div style="position:absolute;left:0;right:0;top:24px;height:44px;background:var(--bg-glass);backdrop-filter:var(--blur-glass);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;font-family:var(--font-serif);font-size:1.1rem;color:var(--gold)">Nabil Pervez</div></div><div class="lbl" style="margin-top:8px">Glass is only used for the fixed nav and the FABs · grain sits over the whole page at 0.55 opacity</div></body></html>
