<!-- @dsCard group="Brand" viewport="700x230" name="Mark tints" subtitle="Six tints per mark, matched to the ground" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="card-theme.js"></script>
<style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.c{display:grid;justify-items:center;gap:7px}.sw{width:100%;height:62px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--border)}.n{font-size:.52rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-family:var(--font-mono)}.u{font-size:.5rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);text-align:center}</style></head>
<body><div class="grid">
<div class="c"><div class="sw" style="background:var(--ink-880)"><img src="../assets/mark-nebtune-gold.png" style="width:34px"></div><span class="n">gold</span><span class="u">champagne · master</span></div><div class="c"><div class="sw" style="background:var(--ink-880)"><img src="../assets/mark-nebtune-gold-bright.png" style="width:34px"></div><span class="n">gold-bright</span><span class="u">on ink</span></div><div class="c"><div class="sw" style="background:var(--paper-50)"><img src="../assets/mark-nebtune-gold-deep.png" style="width:34px"></div><span class="n">gold-deep</span><span class="u">on paper · AA</span></div><div class="c"><div class="sw" style="background:var(--ink-880)"><img src="../assets/mark-nebtune-paper.png" style="width:34px"></div><span class="n">paper</span><span class="u">knockout</span></div><div class="c"><div class="sw" style="background:var(--ink-880)"><img src="../assets/mark-nebtune-white.png" style="width:34px"></div><span class="n">white</span><span class="u">knockout</span></div><div class="c"><div class="sw" style="background:var(--gold-500)"><img src="../assets/mark-nebtune-ink.png" style="width:34px"></div><span class="n">ink</span><span class="u">on gold</span></div>
</div>
<div class="u" style="margin-top:12px;text-align:left;line-height:1.9">Each swatch shows the tint on the ground it is meant for. All three marks — N glyph, NPC monogram, NABIL PERVEZ wordmark — ship in all six.</div>
</body></html>
