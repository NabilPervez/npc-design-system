<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="r" style="gap:14px"><div style="flex:1;text-align:center;font-size:.58rem"><div style="height:52px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card);margin-bottom:8px"></div><div style="color:var(--gold)">--shadow-card</div><div class="lbl">images, hero frames</div></div><div style="flex:1;text-align:center;font-size:.58rem"><div style="height:52px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-card-hover);margin-bottom:8px"></div><div style="color:var(--gold)">--shadow-card-hover</div><div class="lbl">card hover</div></div><div style="flex:1;text-align:center;font-size:.58rem"><div style="height:52px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-fab);margin-bottom:8px"></div><div style="color:var(--gold)">--shadow-fab</div><div class="lbl">FAB rest</div></div><div style="flex:1;text-align:center;font-size:.58rem"><div style="height:52px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-fab-hover);margin-bottom:8px"></div><div style="color:var(--gold)">--shadow-fab-hover</div><div class="lbl">FAB hover · gold glow</div></div></div></body></html>
