<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="r" style="gap:14px;align-items:flex-end"><div style="text-align:center;font-size:.58rem"><div style="width:64px;height:44px;background:var(--bg-card);border:1px solid var(--border);border-radius:5px;margin-bottom:6px"></div><div style="color:var(--gold)">5px</div><div class="lbl">tags</div></div><div style="text-align:center;font-size:.58rem"><div style="width:64px;height:44px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;margin-bottom:6px"></div><div style="color:var(--gold)">6px</div><div class="lbl">buttons</div></div><div style="text-align:center;font-size:.58rem"><div style="width:64px;height:44px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin-bottom:6px"></div><div style="color:var(--gold)">10px</div><div class="lbl">cards</div></div><div style="text-align:center;font-size:.58rem"><div style="width:64px;height:44px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;margin-bottom:6px"></div><div style="color:var(--gold)">20px</div><div class="lbl">date pills</div></div><div style="text-align:center;font-size:.58rem"><div style="width:64px;height:44px;background:var(--bg-card);border:1px solid var(--border);border-radius:50%;margin-bottom:6px"></div><div style="color:var(--gold)">50%</div><div class="lbl">FABs</div></div></div></body></html>
