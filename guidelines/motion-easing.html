<!-- @dsCard group="Motion" viewport="700x150" name="Easing & duration" subtitle="One curve for everything" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g" style="font-size:.68rem">
<div style="display:flex;gap:12px;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex" style="width:120px;color:var(--gold)">--ease</span><span>cubic-bezier(.4, 0, .2, 1) — the only curve</span></div>
<div style="display:flex;gap:12px;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex" style="width:120px;color:var(--gold)">--dur-fast</span><span style="width:60px;color:var(--text-muted)">.20s</span><span>colour, opacity, FAB scale</span></div><div style="display:flex;gap:12px;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex" style="width:120px;color:var(--gold)">--dur-mid</span><span style="width:60px;color:var(--text-muted)">.25s</span><span>card lift + shadow</span></div><div style="display:flex;gap:12px;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex" style="width:120px;color:var(--gold)">--dur-slow</span><span style="width:60px;color:var(--text-muted)">.35s</span><span>theme change, sibling dimming</span></div><div style="display:flex;gap:12px;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex" style="width:120px;color:var(--gold)">--dur-sweep</span><span style="width:60px;color:var(--text-muted)">.55s</span><span>the shine wipe</span></div><div style="display:flex;gap:12px;border-bottom:1px solid var(--border);padding:4px 0"><span class="hex" style="width:120px;color:var(--gold)">--dur-reveal</span><span style="width:60px;color:var(--text-muted)">.60s</span><span>scroll-in fade + 24px rise</span></div>
</div></body></html>
