<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark artwork" subtitle="NABIL PERVEZ artwork, tinted per ground" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="card-theme.js"></script><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:20px 18px;display:grid;gap:16px}.r{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.sw{padding:12px 16px;border-radius:8px;display:grid;place-items:center}.lbl{font-size:.52rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);line-height:1.9}</style></head>
<body><div class="r">
<div class="sw" style="background:var(--ink-880)"><img src="../assets/wordmark-nabil-pervez-gold-bright.png" style="height:26px"></div>
<div class="sw" style="background:var(--paper-50)"><img src="../assets/wordmark-nabil-pervez-gold-deep.png" style="height:26px"></div>
<div class="sw" style="background:var(--gold-500)"><img src="../assets/wordmark-nabil-pervez-ink.png" style="height:26px"></div>
<div class="sw" style="background:var(--ink-880)"><img src="../assets/wordmark-nabil-pervez-white.png" style="height:26px"></div>
</div>
<div class="lbl">Tinted artwork, never a CSS <code>invert()</code> — the source PNG is black-on-transparent and inverting it skips the brand golds entirely. The N glyph is icon-only (favicon, avatar, stamp) and is never paired at equal weight with the wordmark.</div>
</body></html>
