<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div style="border:1px dashed var(--border);border-radius:6px;padding:8px"><div style="height:14px;background:var(--gold-dim);border:1px solid var(--border);border-radius:3px;margin-bottom:8px;font-size:.55rem;color:var(--gold);padding-left:6px">nav · 62px</div><div style="display:grid;grid-template-columns:1fr 160px;gap:26px"><div style="height:96px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:.55rem;color:var(--text-muted);padding:6px">main · 1fr</div><div style="height:96px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;font-size:.55rem;color:var(--text-muted);padding:6px">sidebar · 260px (sticky)</div></div></div><div class="lbl" style="margin-top:8px">--page-max 1100 · --page-pad 40 (22 mobile) · --grid-gap 52 · --section-gap 56 · single breakpoint at 860px</div></body></html>
