<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><style>.list:hover .it{opacity:.28}.list .it:hover{opacity:1!important;border-color:var(--border-strong)}</style>
<div class="list g" style="gap:8px"><div class="it" style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;transition:opacity .35s var(--ease),border-color .25s"><span style="font-family:var(--font-serif);font-weight:600;font-size:1rem">T-Mobile</span></div><div class="it" style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;transition:opacity .35s var(--ease),border-color .25s"><span style="font-family:var(--font-serif);font-weight:600;font-size:1rem">Nabil Pervez Consulting</span></div><div class="it" style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;transition:opacity .35s var(--ease),border-color .25s"><span style="font-family:var(--font-serif);font-weight:600;font-size:1rem">AOE Creative</span></div></div>
<div class="lbl" style="margin-top:8px">Hover the stack · the focused card stays lit, the rest recede — the signature interaction of the résumé</div></body></html>
