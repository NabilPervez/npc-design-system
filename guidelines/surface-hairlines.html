<!-- @dsCard group="Surfaces" viewport="700x130" name="Hairlines" subtitle="Every separator in the system is 1px gold-tinted" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:16px 18px}.g{display:grid;gap:8px}.r{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:6px;height:56px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;font-size:.58rem;letter-spacing:.4px;line-height:1.3}.hex{opacity:.75;font-family:var(--font-mono)}.lbl{font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}</style><script src="card-theme.js"></script></head><body><div class="g"><div style="display:flex;align-items:center;gap:14px"><span style="font-family:var(--font-serif);font-weight:600;font-size:1.05rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);white-space:nowrap">Section Head</span><span style="flex:1;height:1px;background:var(--border)"></span></div>
<div style="height:1px;background:var(--border);margin:10px 0"></div>
<div style="border-left:2px solid var(--gold);padding-left:20px;font-size:.82rem;color:var(--text-muted);font-weight:300">A 2px gold left rule marks the lead paragraph — the one place the brand uses a heavier rule.</div></div></body></html>
