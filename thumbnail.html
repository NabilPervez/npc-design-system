<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;background:var(--ink-880);position:relative;display:grid;place-items:center;overflow:hidden}
.main .pat{position:absolute;inset:0;background-image:var(--pattern-gold);background-size:100px auto;opacity:.16}
.main img{position:relative;width:420px;display:block}
.strip{flex:1;display:flex;flex-direction:column}.strip span{flex:1;display:block}</style></head>
<body><div class="main"><div class="pat"></div><img src="assets/mark-nebtune-gold.png" alt="Nabil Pervez Consulting"></div>
<div class="strip"><span style="background:var(--gold-100)"></span><span style="background:var(--gold-300)"></span><span style="background:var(--gold-500)"></span><span style="background:var(--gold-700)"></span></div>
</body></html>
